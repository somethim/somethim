name: Build portfolio image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: portfolio:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --detach --name portfolio-smoke --publish 127.0.0.1:3000:3000 portfolio:smoke
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs portfolio-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent http://127.0.0.1:3000/assets/arbi-kullakshi-cv.pdf > /dev/null
          docker rm --force portfolio-smoke

      - name: Publish immutable and rolling tags
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/somethim/portfolio:${{ github.sha }}
            ghcr.io/somethim/portfolio:latest
          cache-from: type=gha

  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v6
        with:
          path: tooling

      - name: Check out preserved portfolio
        uses: actions/checkout@v6
        with:
          ref: legacy
          path: legacy

      - name: Enable standalone legacy output
        run: cp tooling/next.config.legacy.ts legacy/next.config.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build legacy smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: legacy
          file: tooling/Dockerfile.legacy
          load: true
          tags: portfolio-legacy:smoke
          cache-from: type=gha,scope=legacy
          cache-to: type=gha,mode=max,scope=legacy

      - name: Smoke test legacy image
        run: |
          docker run --detach --name portfolio-legacy-smoke --publish 127.0.0.1:3000:3000 portfolio-legacy:smoke
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs portfolio-legacy-smoke
              exit 1
            fi
            sleep 1
          done
          docker rm --force portfolio-legacy-smoke

      - name: Publish legacy tag
        uses: docker/build-push-action@v7
        with:
          context: legacy
          file: tooling/Dockerfile.legacy
          push: true
          tags: ghcr.io/somethim/portfolio:legacy
          cache-from: type=gha,scope=legacy
