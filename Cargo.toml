[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
axum = { version = "0.8", optional = true, features = ["macros", "multipart"] }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
leptos_meta = { version = "0.8" }
tokio = { version = "1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

icondata = { version = "0.7", default-features = false, features = ["lucide"] }
leptos_icons = "0.7.1"
web-sys = { version = "0.3", features = [
    "AnimationEvent",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDialogElement",
    "HtmlDocument",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Node",
    "NodeList",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "time",
    "migrate",
    "macros",
], optional = true }
tower-sessions = { version = "0.15", optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = [
    "postgres",
], optional = true }
axum-login = { version = "0.18.0", optional = true }
password-auth = { version = "1.0.0", optional = true }
# Ceremony state is parked in Postgres between the two round trips, never
# handed to the client — the case the "danger" feature exists for.
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
], optional = true }
totp-rs = { version = "6.0.0", features = [
    "gen_secret",
    "otpauth",
    "qr",
    "serde",
    "zeroize",
], optional = true }
secrecy = { version = "0.10.3", features = ["serde"], optional = true }
resend-rs = { version = "0.31.0", default-features = false, features = [
    "rustls-tls",
], optional = true }
rand = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2", optional = true }
tower-http = { version = "0.7.0", features = [
    "trace",
    "compression-full",
    "request-id",
    "sensitive-headers",
    "timeout",
    "limit",
    "fs",
], optional = true }
tower_governor = { version = "0.8.0", optional = true }
axum_csrf = { version = "0.11.0", features = ["layer"], optional = true }
object_store = { version = "0.14.1", optional = true }
infer = { version = "0.22.0", optional = true }
uuid = { version = "1", features = ["v7", "serde"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

[features]
# Use the native server build for ordinary Cargo and rust-analyzer commands.
# cargo-leptos overrides this when it builds the browser bundle with `hydrate`.
default = ["ssr", "hydrate"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:axum-login",
    "dep:password-auth",
    "dep:webauthn-rs",
    "dep:totp-rs",
    "dep:secrecy",
    "dep:resend-rs",
    "dep:rand",
    "dep:sha2",
    "dep:subtle",
    "dep:tower-http",
    "dep:tower_governor",
    "dep:axum_csrf",
    "dep:object_store",
    "dep:infer",
    "dep:uuid",
    "dep:thiserror",
    "dep:time",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Merging full debug info into the server binary overflows 32-bit debug
# relocations once sqlx/rustls are linked; split DWARF keeps it out of the link.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = "line-tables-only"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "portfolio"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/portfolio.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
