<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin / sign in — Arbi Kullakshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=45">
</head>
<body>
  <div class="corner-tl"></div><div class="corner-tr"></div>
  <div class="corner-bl"></div><div class="corner-br"></div>

  <div class="app-container">
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-left">
          <a class="nav-robot" href="index.html" aria-label="Arbi Kullakshi, home">
            <span class="sprite-scale">
              <span class="sprite-slot"><span class="sprite"></span><span class="sprite-eye eye-l"></span><span class="sprite-eye eye-r"></span><span class="sprite-antenna"></span></span>
            </span>
          </a>
        </div>
        <div class="nav-center">
          <a class="nav-link" href="index.html">view site ↗</a>
        </div>
        <div class="nav-right">
          <button class="dark-mode-toggle" aria-label="Toggle theme"><svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="login-container">
        <section class="admin-edit login-card" aria-label="Admin sign in">
          <div class="login-robot" aria-hidden="true">
            <div class="sprite-slot"><div class="sprite"></div><div class="sprite-eye eye-l"></div><div class="sprite-eye eye-r"></div><div class="sprite-antenna"></div></div>
          </div>

          <div class="login-head">
            <p class="section-index">Admin / Authentication</p>
            <h1><span class="prompt-user">arbi@kullakshi</span>:~$ sudo -i</h1>
          </div>

          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <div class="field">
            <label for="login-totp">One-time code <span style="color: var(--text-muted); text-transform: none; letter-spacing: 0;">· TOTP</span></label>
            <input id="login-totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000 000">
          </div>

          <div class="admin-edit-footer">
            <p class="admin-note">Sign-ins are audited — device, time, and IP are logged.</p>
            <button type="button" class="button-primary">Sign in ↘</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <span>Arbi Kullakshi · Admin</span>
      <span>Not signed in</span>
    </footer>
  </div>

  <script src="app.js?v=45"></script>
</body>
</html>
